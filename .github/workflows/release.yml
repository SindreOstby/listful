name: Release

# Publishing a GitHub release deploys the database migrations to Supabase and the Angular app to GitHub Pages.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.117.0
  SUPABASE_PROJECT_ID: zuavucwsgcwbtbxnofir

jobs:
  build:
    name: Test and build app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test -- --watch=false

      # GitHub Pages only serves static files, so build without the SSR server. Every route renders on the client.
      - name: Build for GitHub Pages
        run: npx ng build --output-mode static --base-href "/${{ github.event.repository.name }}/"

      # Angular writes index.csr.html for client-rendered apps. Pages needs index.html, and 404.html makes deep links load the app.
      - name: Prepare Pages files
        run: |
          cd dist/listful/browser
          mv index.csr.html index.html
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist/listful/browser

  deploy-database:
    name: Deploy Supabase migrations and config
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # No `supabase link`: it reads the secret API keys, which would need a riskier token permission.
      - run: supabase db push --project-ref "$SUPABASE_PROJECT_ID"

      # Logs what will change, then applies config.toml with the [remotes.production] overrides.
      - name: Show config changes
        run: supabase config diff --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push config
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

  deploy-app:
    name: Deploy app to GitHub Pages
    needs: deploy-database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
